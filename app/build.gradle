plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kestreldock.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kestreldock.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
