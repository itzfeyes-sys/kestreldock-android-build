name: KestrelDock Android build

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to repository
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/kestreldock-v2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/kestreldock-v2.apk
          if git diff --cached --quiet; then
            echo "APK is already up to date."
          else
            git commit -m "Publish KestrelDock v2 APK [skip ci]"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kestreldock-android-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
